[tox]
envlist = py,quality
requires = tox-uv>=1
skip_missing_interpreters = True

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
commands =
    coverage run -m pytest
    python -m coverage xml

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    pycodestyle src/chem/__init__.py src/chem/tests/__init__.py
    pylint src/chem/__init__.py src/chem/tests/
